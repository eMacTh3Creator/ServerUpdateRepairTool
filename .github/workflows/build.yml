name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WinUpdateRepairTool.csproj

      - name: Build
        run: dotnet build WinUpdateRepairTool.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish WinUpdateRepairTool.csproj -c Release -r win-x64 --self-contained true -o artifacts/ServerUpdateRepairTool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ServerUpdateRepairTool-win-x64
          path: artifacts/ServerUpdateRepairTool/ServerUpdateRepairTool.exe
